   自动切换 fm.res 本地网关（Native 网络策略与壳代理）重试——彻底解决海报加载不出 */
function setImg(el, url){
  if(!url || !el) return;
  if(IMG_PROXY && url.indexOf('image.tmdb.org')>=0){ try{ url = IMG_PROXY + encodeURIComponent(url); }catch(e){} }
  el.setAttribute('data-src', url);
  el.src = url;
  var tries=0;
  function check(){
    if(!el || !el.parentNode) return;
    try{
      var done = el.complete && el.naturalWidth>0;
      if(done) return;
    }catch(e){ return; }
    fmReady().then(function(fm){
      if(!el || !el.parentNode) return;
      if(fm && fm.res){
        if(!el.getAttribute('data-fm')){
          el.setAttribute('data-fm','1');

        }
        return;
      }
      /* fm 尚未就绪（壳子注入晚于渲染）：延迟重查，最多 3 次 */
      if(tries < 3){
        tries++;
        setTimeout(check, 2000);
      }
    });
  }
  check();
}

/* 浏览器侧请求：失败自动退避重试 3 次（目标接口偶发抖动），pan 类请求支持代理前缀 */
function browserFetch(url, opts, n){
  n = n||0;
  var ac = (typeof AbortController!=='undefined') ? new AbortController() : null;
  var t = setTimeout(function(){ if(ac) ac.abort() }, (opts.timeout||18)*1000);
  return fetch(url, {method:opts.method||'GET', headers:opts.headers||{}, body:opts.body, signal:ac?ac.signal:undefined}).then(function(r){
    clearTimeout(t);
    if(!r.ok) throw new Error('HTTP '+r.status);
    var ct=r.headers.get('content-type')||'';
    return ct.indexOf('json')>=0 ? r.json() : r.text();
  }, function(e){
    clearTimeout(t);
    if(n < 2) return new Promise(function(res, rej){
      setTimeout(function(){ browserFetch(url, opts, n+1).then(res, rej) }, 450*(n+1));
    });
    throw e;
  });
}
/* 请求：壳子内走 fm.req（绕过 CORS），浏览器走 fetch */
function apiReq(url, opts){
  opts = opts||{};
  var target = url;
  if(opts.pan && PAN_PROXY) target = PAN_PROXY.replace(/\/+$/,'') + '/?url=' + encodeURIComponent(url);
  return fmReady().then(function(fm){
    if(fm && fm.req){
      return fm.req(target, {method:opts.method||'GET', headers:opts.headers||{}, body:opts.body, responseType:opts.responseType||'text', timeout:opts.timeout||18}).then(function(r){
        if(r && r.error) throw new Error(r.error);
        if(r && r.ok===false) throw new Error('HTTP '+(r.status||0));
        var b = r && r.body;
        if(typeof b==='string'){ try{ return JSON.parse(b) }catch(e){ return b } }
        return b;
      });
    }
    return browserFetch(target, opts);
  });
}

/* TMDB 数据缓存层：内存 → sessionStorage（10 分钟 TTL）→ 网络。
   重复进入分类 / 详情 / 首页不再重复请求，显著加快电视端二次浏览。 */
var REQ_CACHE={};
function cachedReq(url, opts, ttl){
  ttl = ttl||600;
  var now=Date.now(), mem=REQ_CACHE[url];
  if(mem && now-mem.t < ttl*1000) return Promise.resolve(mem.d);
  var ss='';
  try{ ss=sessionStorage.getItem('c4kq_'+url)||'' }catch(e){}
  if(ss){ try{ var o=JSON.parse(ss); if(o && now-o.t<ttl*1000){ REQ_CACHE[url]={t:o.t,d:o.d}; return Promise.resolve(o.d); } }catch(e){} }
  return apiReq(url, opts).then(function(d){
    REQ_CACHE[url]={t:now,d:d};
    try{ sessionStorage.setItem('c4kq_'+url, JSON.stringify({t:now,d:d})) }catch(e){}
    return d;
  });
}

}
function applySort(s, kind, p){

function applyArea(a, p){

  else if(a==='欧美') p.with_origin_country='US|GB|FR|DE|CA|AU|ES|IT';
  else if(a==='国外') return;
  else if(COUNTRIES[a]) p.with_origin_country=COUNTRIES[a];
}
function applyYear(y, kind, p){
  if(!y||y==='全部'||y==='全部年代'||y==='') return;

  else if(/^(\d{4})年代$/.test(y)){ n=parseInt(y,10); p[g+'.gte']=n+'-01-01'; p[g+'.lte']=(n+9)+'-12-31'; }
  else if(y==='更早'){ p[g+'.lte']='1979-12-31'; }

}
/* 片库 handler → TMDB 请求 */

function tmdbUrl(path, params, page){
  var u = new URL(TMDB.apiBase + path);
  u.searchParams.set('api_key', TMDB.apiKey);
  u.searchParams.set('language', TMDB.lang);
  if(page) u.searchParams.set('page', page);
  for(var k in params||{}) if(params[k]!=null && params[k]!=='') u.searchParams.set(k, params[k]);
  return u.toString();
}
function normTmdb(r, mtype){
  var mt = mtype || (r.media_type==='tv'?'tv': r.media_type==='movie'?'movie': (r.name&&!r.title?'tv':'movie'));
  return { id:r.id, mediaType:mt, title:r.title||r.name||'', year:(r.release_date||r.first_air_date||'').slice(0,4), rate:r.vote_average||0,
    poster: r.poster_path? TMDB.img+r.poster_path : '', back: r.backdrop_path? TMDB.back+r.backdrop_path : '', overview:r.overview||'' };
}
/* 自定义豆瓣接口（可选）：GET {CUSTOM_API}/douban/{handler}?page=&sort=&类型=&地区=&年代=&榜单=…
   返回格式：{list:[{id,title,year,rate,image,overview}], total} 或 {data:[...]} / {results:[...]} */
function buildCustomReq(clsId, sel, page){
  var cls=clsById(clsId), qs=['page='+page];
  for(var k in sel||{}) if(sel[k]) qs.push(encodeURIComponent(k)+'='+encodeURIComponent(sel[k]));
  return CUSTOM_API.replace(/\/+$/,'')+'/douban/'+(cls.handler||clsId)+'?'+qs.join('&');
}
function normCustom(resp){
  var arr = (resp&&resp.list)||(resp&&resp.data)||(resp&&resp.results)||(resp&&resp.items)||[];
  if(arr && !Array.isArray(arr) && arr.list) arr=arr.list;
  if(!Array.isArray(arr)) arr=[];
  return arr.map(function(it){
    var rv = it.rating||{};
    return { id:it.id||it.vod_id||it.douban_id||'', mediaType: it.type==='tv'?'tv':(it.vod_type==='tv'?'tv':'movie'), title:it.title||it.name||it.vod_name||'',
      year: it.year||(it.pubdate||'').slice(0,4), rate: it.rate||it.vote||it.score||rv.value||0,
      poster: it.image||it.cover||it.pic||(rv.cover_url)||(it.cover&&it.cover.url)||'', back: it.backdrop||it.background||'', overview: it.overview||it.desc||it.vod_content||'' };
  });
}
function fetchList(clsId, sel, page){
  if(CUSTOM_API){
    return apiReq(buildCustomReq(clsId, sel, page), {responseType:'json', timeout:20}).then(function(d){
      return { list: normCustom(d), totalPages: d&&d.total_pages ? d.total_pages : ((d&&d.total) ? Math.ceil(Number(d.total)/20) : 1) };
    }).catch(function(){ return fetchTmdbList(clsId, sel, page); });
  }
  return fetchTmdbList(clsId, sel, page);
}
function fetchTmdbList(clsId, sel, page){
  var req = buildListReq(clsId, sel, page);
  return cachedReq(tmdbUrl(req.path, req.params, page), {responseType:'json'}).then(function(d){
    return { list: (d.results||[]).map(function(r){ return normTmdb(r) }), totalPages: d.total_pages||1 };
  });
}

      .then(function(d){ return { list: normCustom(d).filter(function(x){return x.title}), totalPages:1 } })
      .catch(function(){ return fetchTmdbSearch(q, page); });

function normDetailTmdb(d, t){

/* ============ 5. 网盘资源搜索 ============ */
var PAN_QUALITY=[{k:['dolby vision','dovi','杜比视界','dv'],s:100},{k:['hdr10+','hdr10plus'],s:90},{k:['hdr10','hdr','hlg'],s:80},{k:['4k','2160p','uhd','8k'],s:70},{k:['remux','蓝光原盘','原盘','bluray','blu-ray'],s:65},{k:['高码率','高码','x265','h265','hevc'],s:55},{k:['杜比全景声','dolby atmos','atmos'],s:50},{k:['1080p','1080i','fhd'],s:40},{k:['60fps','60帧'],s:30},{k:['720p'],s:20},{k:['web-dl','webdl','bdrip'],s:15},{k:['国语','粤语','国粤','中字','双语'],s:5}];
function panScore(title){ var t=String(title||'').toLowerCase(), s=0; PAN_QUALITY.forEach(function(r){ if(r.k.some(function(k){return t.indexOf(k.toLowerCase())>=0})) s+=r.s; }); return s; }
function panTags(title){
  var t=String(title||'').toLowerCase(), tags=[];
  if(/dolby.?vision|dovi|杜比视界|dv/.test(t)) tags.push('杜比视界');
  else if(/hdr10\+|hdr10plus/.test(t)) tags.push('HDR10+');
  else if(/hdr/.test(t)) tags.push('HDR');
  if(/4k|2160p|uhd|8k/.test(t)) tags.push('4K');
  if(/remux|蓝光原盘|bluray|blu-ray|原盘/.test(t)) tags.push('蓝光');
  if(/1080p|1080i/.test(t)) tags.push('1080P');
  return tags.slice(0,3);
}
function searchPan(kw){
  return apiReq(PAN_API+'/api/search', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({kw:kw,res:'merge',src:'all',cloud_types:PAN_TYPES}), responseType:'json', timeout:20, pan:true}).then(function(d){
    var byType = (d&&d.data&&d.data.merged_by_type)||(d&&d.merged_by_type)||{};
    var out=[], seen={};
    for(var t in byType){
      if(PAN_TYPES.indexOf(t)<0) continue;
      (byType[t]||[]).forEach(function(it){
        var url=it.url||it.share_url||'';
        if(!url) return;
        var k=t+'|'+url.replace(/[?&]+$/,'');
        if(seen[k]) return; seen[k]=1;
        out.push({type:t, title:cleanStr(it.note||it.title||it.name||kw), url:url, password:it.password||it.pwd||'', date:it.datetime||it.time||''});
      });
    }
    out.forEach(function(x){ x._score=panScore(x.title); });
    out.sort(function(a,b){ return b._score-a._score; });
    return out;
  });
}

/* App 历史 key 格式 siteKey@@@vodId（官方规范），字段缺失时拆分兜底 */
function historyKeyParts(it){
  var key=String(it&&it.key||'');
  var parts=key.split('@@@');
  return { key:key, siteKey:it&&it.siteKey||parts[0]||'', vodId:it&&it.vodId||parts[1]||'' };
}
function loadContinue(){
  var r=$('continue'), plays=readPlays();
  fmReady().then(function(fm){
    var shellItems=[];
    if(fm && fm.history){
      try {
        return Promise.resolve(fm.history()).then(function(h){
          (h||[]).forEach(function(it){
            var hp=historyKeyParts(it);
            if(!hp.siteKey || !hp.vodId) return;
            var title=it.vodName||it.title||'';
            if(!title) return;
            if(hp.siteKey==='push_agent'){
              var art=pushArtFor(hp.vodId, title);
              shellItems.push({title:title, siteKey:hp.siteKey, vodId:hp.vodId, pic:(art&&art.pic)||it.vodPic||it.pic||'', wallPic:(art&&art.wallPic)||it.wallPic||'', progress:Number(it.position||it.progress||0), isPush:true});
            } else {
              shellItems.push({title:title, siteKey:hp.siteKey, vodId:hp.vodId, pic:it.vodPic||it.pic||'', wallPic:it.wallPic||'', progress:Number(it.position||it.progress||0), isPush:false});
            }
          });
          return shellItems;
        }).catch(function(){ return []; });
      } catch(e){ return []; }
    }
    return [];
  }).then(function(shellItems){
    var locals=plays.slice(0,8);
    r.innerHTML='';
    if(!locals.length && !shellItems.length){ $('continueSub').textContent='还没有观看记录'; r.innerHTML='<div class="empty" style="padding:20px 0;text-align:left">去首页或分类里挑一部开始看吧</div>'; return; }
    $('continueSub').textContent= shellItems.length?'App 观看历史 · 自动同步':'接着上次的位置继续';
    locals.forEach(function(m,i){
      var b=card(m,i,{});
      b.onclick=function(){ openDetail(m) };
      r.appendChild(b);
    });
    shellItems.forEach(function(s,i){
      var b=card({title:s.title, pic:s.pic, mediaType:'', year:'', rate:''}, i, {progress:s.progress});
      b.onclick=function(){
        fmReady().then(function(fm){
          if(s.isPush){ if(fm&&fm.play){ fm.play(s.vodId, s.title, {pic:s.pic, wallPic:s.wallPic}); return; } }
          else if(fm&&fm.vod){ fm.vod(s.siteKey, s.vodId, s.title, s.pic); return; }
          toast('App 历史仅可在壳子内续播');
        });
      };
      r.appendChild(b);
    });
    setImgs(r);
  });
}

function setBehindInert(inert){
  var containers=[document.getElementById('homeView'),document.getElementById('browseView'),document.getElementById('favsView')];
  for(var c=0;c<containers.length;c++){
    if(!containers[c]) continue;
    var els=containers[c].querySelectorAll('button,[tabindex],input,a,select');
    for(var i=0;i<els.length;i++){
      if(inert){
        if(els[i].getAttribute('data-ti')==null) els[i].setAttribute('data-ti', els[i].getAttribute('tabindex')||'0');
        els[i].setAttribute('tabindex','-1');
      } else {
        var ti=els[i].getAttribute('data-ti');
        if(ti!=null){ els[i].setAttribute('tabindex',ti); els[i].removeAttribute('data-ti'); }
      }
    }
  }
}

        b.innerHTML=(s.poster?'<img data-src="'+esc(s.poster)+'" alt="" loading="lazy" decoding="async" onerror="imgFail(this)">':'<div class="poster p'+(i%8)+'"></div>')+'<div class="st">'+esc(s.title)+'</div>';
        b.onclick=function(){ openDetail(s) };
        row.appendChild(b);
      });
      setImgs(row);
    } else row.innerHTML='<div class="empty">暂无推荐</div>';
  }
}

/* ============ 12. 播放流程（网盘搜索 → 壳子播放） ============ */
function playFlow(){
  var item=state.activeItem; if(!item) return;
  addPlayRecord(item);
  var kw=cleanStr(item.title);
  openRespanel();
  setResStatus('正在搜索网盘资源…');
  state.panAuto=true;
  searchPan(kw).then(function(list){
    state.panList=list;
    if(!list.length){ setResStatus('未找到网盘资源，可试试原生搜索', false, true); renderResTabs([]); return; }
    if(!list.some(function(x){return x.type===state.panType})) state.panType=list[0].type;
    renderResTabs(list); renderResList(state.panType||list[0].type);
    toast('已为你播放最佳资源');
    setTimeout(function(){ if(state.panList.length) playRes(state.panList[0], item.title) },350);
  }).catch(function(){ setResStatus('资源搜索失败，可重试或试试原生搜索', true, true); renderResTabs([]); });
}
function openRespanel(){
  $('respanel').classList.remove('hidden');
  $('resSub').textContent = SHELL_SITE_NAME ? ('当前片源：'+SHELL_SITE_NAME+' · 可用原生搜索') : (SHELL_CONFIG_DESC ? ('片源配置：'+SHELL_CONFIG_DESC) : '');
}
function closeRespanel(force){
  if(force===true){ $('respanel').classList.add('hidden'); return; }

}
function setResStatus(t, withRetry, withFallback){
  var h='<div class="rstatus">'+esc(t)+'</div>';
  if(withRetry) h+='<div style="text-align:center;margin-top:6px"><button class="rtab focus" id="resRetry" tabindex="0">重试</button></div>';
  if(withFallback){
    h+='<div class="rfallback"><button class="rtab focus" id="resNative" tabindex="0">原生搜索</button><button class="rtab focus" id="resOpenVod" tabindex="0">打开 App 影视</button></div>';
  }
  $('reslist').innerHTML=h;
  $('restabs').innerHTML='';
  var rb=$('resRetry'); if(rb) rb.onclick=playFlow;
  var rn=$('resNative'); if(rn) rn.onclick=function(){
    fmReady().then(function(fm){
      var t=(state.activeItem&&state.activeItem.title)?state.activeItem.title:'';
      if(fm&&fm.search){ fm.search(t,{direct:false}); return; }
      toast('当前环境不支持原生搜索');
    });
  };
  var rv=$('resOpenVod'); if(rv) rv.onclick=function(){
    fmReady().then(function(fm){ if(fm&&fm.openVod) fm.openVod(); else toast('请在 App 内使用'); });
  };
}
function renderResTabs(list){
  var types=[], seen={};
  list.forEach(function(x){ if(!seen[x.type]){ seen[x.type]=1; types.push(x.type); } });
  var box=clearEl('restabs');
  types.forEach(function(t){
    var b=document.createElement('button'); b.className='rtab focus'+(t===state.panType?' active':''); b.tabIndex=0;
    b.textContent=(PAN_LABEL[t]||t)+' '+list.filter(function(x){return x.type===t}).length;
    b.onclick=function(){ state.panType=t; renderResTabs(list); renderResList(t); b.focus(); };
    box.appendChild(b);
  });
  $('resSub').textContent='共 '+list.length+' 个资源 · '+(SHELL_SITE_NAME?('片源 '+SHELL_SITE_NAME):'点击播放');
}
/* 壳子原生网盘检测：给资源列表加有效性圆点（ok 绿 / bad 红 / locked 黄 / uncertain 灰） */
var PAN_CHECK_TYPES={quark:1,aliyun:1,baidu:1,uc:1,tianyi:1,xunlei:1,'123':1,115:1,mobile:1};
function checkPanHealth(list){
  if(!list || !list.length) return;
  fmReady().then(function(fm){
    if(!fm || !fm.pan || !fm.pan.check) return;
    if(SHELL_DRIVE_CHECK===false) return;
    var items=[], idxs=[];
    list.forEach(function(p,i){
      if(items.length>=10) return;
      if(!PAN_CHECK_TYPES[p.type]) return;
      items.push({type:p.type, url:p.url, password:p.password||''}); idxs.push(i);
    });
    if(!items.length) return;
    fm.pan.check(items).then(function(r){
      var res=r&&r.results||[];
      var els=document.querySelectorAll('#reslist .ritem');
      res.forEach(function(rs,j){
        var idx=idxs[j];
        if(!rs || !rs.state || idx==null) return;
        var el=els[idx];
        if(!el) return;
        var dot=el.querySelector('.rdot');
        if(dot){
          if(rs.state==='ok') dot.className='rdot r-ok';
          else if(rs.state==='bad'){ dot.className='rdot r-bad'; el.style.opacity='.4'; }
          else if(rs.state==='locked') dot.className='rdot r-locked';
          else dot.className='rdot r-unc';
        }
      });
    }).catch(function(){});
  });
}
function renderResList(type){
  var box=clearEl('reslist'), list=state.panList.filter(function(x){return x.type===type});
  if(!list.length){ box.innerHTML='<div class="rstatus">该类型暂无资源</div>'; return; }
  list.forEach(function(p){
    var b=document.createElement('button'); b.className='ritem focus'; b.tabIndex=0;
    var tags=panTags(p.title);
    b.innerHTML='<div class="rline"><span class="rdot"></span><span class="rname">'+esc(p.title)+'</span>'+(tags.length?'<span class="rtags">'+tags.map(function(t){return '<span class="rtag">'+esc(t)+'</span>'}).join('')+'</span>':'')+'</div><div class="rmeta">'+esc(PAN_LABEL[p.type]||p.type)+(p.password?' · 提取码 '+esc(p.password):'')+(p.date&&p.date.indexOf('0001')<0?' · '+esc(String(p.date).slice(0,10)):'')+'</div>';
    b.onclick=function(){ playRes(p, state.activeItem?state.activeItem.title:'') };
    box.appendChild(b);
  });
  checkPanHealth(list);
}
function addPlayRecord(item){
  var plays=readPlays();
  plays=plays.filter(function(x){ return !(x.id===item.id && x.mediaType===(item.mediaType||'')) });
  plays.unshift({id:item.id, mediaType:item.mediaType||'movie', title:item.title, year:item.year, rate:item.rate, pic:item.poster, at:Date.now()});
  if(plays.length>30) plays.length=30;
  storeSet(K_PLAY, JSON.stringify(plays));
}
function readPlays(){ try{ return JSON.parse(localStorage.getItem(K_PLAY)||'[]') }catch(e){ return [] } }
/* 推送播放海报缓存：播放前按 URL 存 {title,pic,wallPic}，供 fm.history() push_agent 记录恢复 */
function pushArtKey(url){ return String(url||'').replace(/^push:\/\//i,''); }
function savePushArtwork(p, title, pic, wallPic){
  var u=pushArtKey(p&&p.url);
  if(!u) return;
  var all={}; try{ var old=JSON.parse(localStorage.getItem(K_PUSHART)||'null'); if(old&&old.items) all=old.items; }catch(e){}
  all[u]={title:title||'', pic:pic||'', wallPic:wallPic||'', at:Date.now()};
  var keys=Object.keys(all).sort(function(a,b){ return Number(all[b]&&all[b].at||0)-Number(all[a]&&all[a].at||0); });
  var limited={}; keys.slice(0,120).forEach(function(k){ limited[k]=all[k]; });
  storeSet(K_PUSHART, JSON.stringify({version:1, items:limited}));
}
function pushArtFor(url, title){
  try{ var old=JSON.parse(localStorage.getItem(K_PUSHART)||'null'); if(!old||!old.items) return null;
    var key=pushArtKey(url), items=old.items;
    if(key&&items[key]) return items[key];
    if(title){ var t=cleanStr(title); for(var k in items){ if(items[k]&&cleanStr(items[k].title||'')===t) return items[k]; } }
  }catch(e){}
  return null;
}
function playRes(p, title){
  var item=state.activeItem;
  if(item) addPlayRecord(item);
  var pic=item?item.poster:'', wallPic=item?item.back||item.poster:'';
  if(pic||wallPic) savePushArtwork(p, title||p.title, pic, wallPic);
  fmReady().then(function(fm){
    if(fm && fm.pan && fm.pan.play){
      return fm.pan.play({type:p.type||'', url:p.url, password:p.password||'', title:title||p.title, pic:pic, wallPic:wallPic}).catch(function(e){
        if(fm && fm.play) return fm.play(/^magnet:/i.test(p.url)?p.url:'push://'+p.url, title||p.title, {pic:pic, wallPic:wallPic});
        throw e;
      });
    }
    if(fm && fm.play){ return fm.play(/^magnet:/i.test(p.url)?p.url:'push://'+p.url, title||p.title, {pic:pic, wallPic:wallPic}); }
    window.open(p.url,'_blank');
    return null;
  }).catch(function(e){ toast('播放失败：'+(e&&e.message||'未知错误')); });
}
$('dplay').onclick=function(){ playFlow(); };
$('resourceBtn').onclick=function(){

/* ============ 16. 遥控器按键 ============ */
document.addEventListener('keydown',function(e){
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter','Escape','Backspace'].indexOf(e.key)>=0) e.preventDefault();
  if(e.key==='Escape'||e.key==='Backspace'){
    if($('search').classList.contains('open')){ closeSearch(); return; }
    if($('drawer').classList.contains('open')){ closeDrawer(); return; }
    if($('detail').classList.contains('open')){ closeDetail(); return; }
    if(state.view==='browse'||state.view==='favs'){ showHome(); return; }
  }
  if(e.key==='Enter'){
    var a=document.activeElement;
    if(a&&a.classList.contains('focus')&&a.tagName!=='INPUT') a.click();
    return;
  }
  if(!/^Arrow/.test(e.key)) return;
  var cur=document.activeElement;
  if(!cur||!cur.classList.contains('focus')) return;
  var cr=cur.getBoundingClientRect(),cx=cr.left+cr.width/2,cy=cr.top+cr.height/2,dir=e.key.replace('Arrow','').toLowerCase(),best=null,bs=1e9;
  document.querySelectorAll('.focus').forEach(function(el){
    if(el===cur) return;
    if(el.offsetParent===null && el.getBoundingClientRect().width===0) return;
    var r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,dx=x-cx,dy=y-cy;
    if(dir==='left'&&dx>=-8||dir==='right'&&dx<=8||dir==='up'&&dy>=-8||dir==='down'&&dy<=8) return;
    var p=Math.abs(dir==='left'||dir==='right'?dx:dy),s=Math.abs(dir==='left'||dir==='right'?dy:dx),score=p+1.8*s;
    if(score<bs){bs=score;best=el}
  });
  /* 从卡片或快速入口按上/下键时，优先在卡片和快速入口中找最近的目标（避免跳过快速入口或跳到导航栏） */
  if(cur.classList && (cur.classList.contains('card')||cur.classList.contains('quickbtn')) && (dir==='up'||dir==='down')){
    var _cb=null, _cbs=1e9;
    document.querySelectorAll('.card.focus, .quickbtn.focus').forEach(function(el){
      if(el===cur) return;
      if(el.offsetParent===null && el.getBoundingClientRect().width===0) return;
      var r=el.getBoundingClientRect(),_x=r.left+r.width/2,_y=r.top+r.height/2,_dx=_x-cx,_dy=_y-cy;
      if(dir==='up'&&_dy>=-8||dir==='down'&&_dy<=8) return;
      var _sc=Math.abs(_dy)+1.8*Math.abs(_dx);
      if(_sc<_cbs){_cbs=_sc;_cb=el;}
    });
    if(_cb) best=_cb;
  }
  if(best){
    best.focus();
    /* 焦点从下方卡片跳到 hero 按钮时，强制回滚到顶部，避免 hero 标题上半部分被固定导航栏遮住 */
    var _p=best;
    while(_p){ if(_p.classList && _p.classList.contains('hero')){ var _hv=document.getElementById('homeView'); if(_hv) _hv.scrollTop=0; break; } _p=_p.parentElement; }
  }
},true);
